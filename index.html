    <script>
      // Fallback service worker registration for static environments
      if ('serviceWorker' in navigator && !window.__vite_plugin_pwa_registered) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js').catch((err) => {
            console.log('SW registration note:', err);
          });
        });
      }
